# ============================================================================
# multimodal-MoE — conda environment specification
# ============================================================================
# Reproduces the working development environment for BEVFusion + ZOD training.
#
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
#
# After creation, two manual steps are required:
#   1. mim install mmcv==2.2.0
#   2. cd /path/to/mmdetection3d && pip install -e .
# See README.md "Environment setup" for full instructions.
# ============================================================================
name: multimodal-moe
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip>=24.0

  # ── Scientific core (conda-native for MKL/BLAS) ───────────────────────
  - numpy=1.26.4
  - scipy=1.15
  - scikit-learn=1.7
  - pandas=2.3
  - pyarrow>=14

  # ── Jupyter (conda-forge has better kernel integration) ────────────────
  - ipykernel>=7.0
  - jupyter_client>=8.0
  - ipython>=8.0

  # ── Everything else via pip ────────────────────────────────────────────
  - pip:
      # PyTorch — CUDA 12.1 wheels from pytorch.org
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.4.0+cu121
      - torchvision==0.19.0+cu121
      - torchaudio==2.4.0+cu121

      # Image & vision
      - opencv-python==4.9.0.80
      - pillow>=12.0
      - matplotlib>=3.5
      - ultralytics>=8.4

      # OpenMMLab (mmcv installed separately via mim)
      - mmengine==0.10.7
      - mmdet==3.3.0
      - openmim==0.3.9
      # mmcv==2.2.0   → mim install mmcv==2.2.0 (needs CUDA at build time)
      # mmdet3d==1.4.0 → pip install -e /path/to/mmdetection3d (local clone)

      # Dataset & domain
      - zod==0.8.0
      - nuscenes-devkit==1.1.11
      - pycocotools>=2.0

      # Training & logging
      - tqdm>=4.65
      - tensorboard>=2.14
      - pyyaml>=6.0
      - rich>=13.0
      - tabulate>=0.9

      # Notebook extras
      - plotly>=6.0
      - h5py>=3.10
      - ipywidgets>=8.0
